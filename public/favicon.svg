<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <!-- Glow/Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring (Glow Border) -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="16" />

  <!-- Inner Code Symbol </ > -->
  <g filter="url(#glow)">
    <!-- Left bracket < -->
    <path d="M190 160 L90 256 L190 352" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Slash / -->
    <path d="M225 380 L287 132" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" />
    
    <!-- Right bracket > -->
    <path d="M322 160 L422 256 L322 352" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>